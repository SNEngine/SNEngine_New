<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>FPS Counter - Native</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: transparent;
            font-family: Consolas, monospace;
            font-size: 18px;
            color: #ffffff;
            overflow: hidden;
        }

        #fps {
            position: fixed;
            top: 12px;
            left: 12px;
            padding: 6px 12px;
            background: rgba(0, 0, 0, 0.75);
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            user-select: none;
            pointer-events: none;
            z-index: 9999;
            font-weight: bold;
            letter-spacing: 1px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
        }

        .native {
            color: #00ffaa;
        }
    </style>
</head>
<body>
    <div id="fps">FPS: -- <span style="font-size:14px;color:#aaa;">(native)</span></div>

    <script>
        const fpsDisplay = document.getElementById('fps');

        console.log("[FPS] FPS Counter initialized");

        function updateNativeFPS() {
            try {
                // Используем сгенерированный фасад
                const fps = sn.Native.GetFPS();

                console.log("[FPS] Native FPS received:", fps);

                if (typeof fps === "number" && !isNaN(fps)) {
                    const rounded = Math.round(fps);
                    fpsDisplay.innerHTML = `FPS: <span class="native">${rounded}</span> <span style="font-size:14px;color:#aaa;">(native)</span>`;
                } else {
                    fpsDisplay.textContent = "FPS: ---";
                }
            } catch (e) {
                console.error("[FPS] Error getting native FPS:", e);
                fpsDisplay.textContent = "FPS: ERR";
            }

            setTimeout(updateNativeFPS, 200);
        }

        // Запуск
        updateNativeFPS();
    </script>
</body>
</html>
