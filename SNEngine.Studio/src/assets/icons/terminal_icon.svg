<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Окно терминала -->
  <rect 
    x="3" 
    y="4" 
    width="18" 
    height="16" 
    rx="2" 
    stroke="currentColor" 
    stroke-width="1.8"/>
  
  <!-- Заголовок (верхняя панель) -->
  <rect 
    x="3" 
    y="4" 
    width="18" 
    height="3" 
    rx="1" 
    stroke="currentColor" 
    stroke-width="1.8"/>

  <!-- Три точки в заголовке -->
  <circle cx="6.5" cy="5.5" r="1" fill="currentColor"/>
  <circle cx="9.5" cy="5.5" r="1" fill="currentColor"/>
  <circle cx="12.5" cy="5.5" r="1" fill="currentColor"/>

  <!-- Содержимое терминала (командные строки) -->
  <rect x="6" y="10" width="12" height="1.1" rx="0.2" fill="currentColor"/>
  <rect x="6" y="13" width="9"  height="1.1" rx="0.2" fill="currentColor"/>
  <rect x="6" y="16" width="10" height="1.1" rx="0.2" fill="currentColor"/>

  <!-- Курсор -->
  <rect x="16.5" y="13" width="1" height="1.5" fill="currentColor"/>
</svg>