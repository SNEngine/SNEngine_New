<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <circle 
    class="spinner-track" 
    cx="50" 
    cy="50" 
    r="44" 
    fill="none" 
    stroke="#333333" 
    stroke-width="8" 
    stroke-linecap="round"
  />
  <circle 
    class="spinner-dash" 
    cx="50" 
    cy="50" 
    r="44" 
    fill="none" 
    stroke="#FF5252" 
    stroke-width="8" 
    stroke-linecap="round"
    stroke-dasharray="80 200"
    stroke-dashoffset="0"
  />
</svg>