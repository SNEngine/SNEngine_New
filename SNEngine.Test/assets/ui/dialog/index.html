<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Novel Dialog</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      background: transparent;
      position: relative;
      overflow: hidden;
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 20px;
      color: #eeeeee;
    }

    #dialog-container {
      position: absolute;
      bottom: 5%;
      left: 50%;
      transform: translateX(-50%);
      width: 85%;
      max-width: 1100px;
      background: #1e1e1e;
      border: 3px solid #FF5252;
      border-radius: 24px; /* более скруглённый */
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.8);
      padding: 14px 24px 18px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      animation: dialog-outline-blink 1.1s infinite ease-in-out;
    }

    @keyframes dialog-outline-blink {
      0%, 100% {
        border-color: #FF5252;
        outline: 6px solid rgba(255, 82, 82, 0.0);
        outline-offset: 0px;
      }
      50% {
        border-color: #ff9999;
        outline: 6px solid rgba(255, 82, 82, 0.6);
        outline-offset: 5px;
      }
    }

    #speaker {
      font-weight: 600;
      font-size: 20px;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .speaker-triangle {
      color: #FF5252;
      font-size: 15px;
      line-height: 1;
      animation: blink 1.1s infinite ease-in-out; /* синхронизировано с рамкой */
      flex-shrink: 0;
    }

    #dialog-text {
      font-size: 19px;
      line-height: 1.4;
      min-height: 60px;
      color: #eeeeee;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.2; }
    }
  </style>
</head>
<body>
  <div id="dialog-container">
    <div id="speaker">
      <span class="speaker-triangle">▶</span>
      <span id="speaker-name">Имя персонажа</span>
    </div>
    <div id="dialog-text">
      Здесь будет отображаться текст диалога. Можно обновлять через JavaScript.
    </div>
  </div>

  <script>
    // =====================================================
    // Авто-скрытие диалога через polling (setInterval)
    // Читает window.SNEngine.runtime.dialog, который пушится
    // из C# через SNEngineRuntimeBridge.SetDialogState()
    //
    // Если dialog == null / visible == false / нет текста — контейнер скрывается.
    // Это "костыль", но по требованию заказчика — через интервалы.
    // =====================================================

    const DIALOG_POLL_INTERVAL_MS = 80; // достаточно часто, дёшево

    function applyDialogState(state) {
      const container = document.getElementById('dialog-container');
      const nameEl = document.getElementById('speaker-name');
      const textEl = document.getElementById('dialog-text');

      if (!container || !nameEl || !textEl) return;

      const hasContent = state && state.visible !== false &&
                         (state.speaker || state.text);

      if (!hasContent) {
        // Скрываем диалог полностью
        container.style.display = 'none';
        return;
      }

      // Показываем
      container.style.display = 'flex';

      // Имя спикера + цвет (если пришёл из CharacterData.Color)
      nameEl.textContent = state.speaker || '';
      if (state.color) {
        nameEl.style.color = state.color;
      } else {
        nameEl.style.color = '#ffffff';
      }

      // Текст (поддержка простого HTML)
      textEl.innerHTML = state.text || '';
    }

    function pollDialogFromRuntime() {
      try {
        const runtime = (window.SNEngine && window.SNEngine.runtime) || {};
        const dialogState = runtime.dialog;   // { speaker, text, color, visible } | null

        applyDialogState(dialogState);
      } catch (e) {
        // На всякий случай — не ломать рендер
        console.warn('[DialogUI] poll error', e);
      }
    }

    // Запускаем polling сразу
    setInterval(pollDialogFromRuntime, DIALOG_POLL_INTERVAL_MS);

    // Публичный API (можно вызывать напрямую из C# через JS facade, если понадобится)
    window.DialogUI = {
      setSpeaker(name) {
        const nameEl = document.getElementById('speaker-name');
        if (nameEl) nameEl.textContent = name || '';
      },
      setText(text) {
        document.getElementById('dialog-text').innerHTML = text || '';
      },
      setColor(color) {
        const nameEl = document.getElementById('speaker-name');
        if (nameEl && color) nameEl.style.color = color;
      },
      clear() {
        const nameEl = document.getElementById('speaker-name');
        const textEl = document.getElementById('dialog-text');
        if (nameEl) {
          nameEl.textContent = '';
          nameEl.style.color = '#ffffff';
        }
        if (textEl) textEl.innerHTML = '';

        // Явно говорим runtime, что диалога нет (на случай, если polling чуть запаздывает)
        if (window.SNEngine && window.SNEngine.runtime) {
          window.SNEngine.runtime.dialog = null;
        }
      },
      // Прямое управление из JS (для отладки)
      forceShow(speaker, text, color) {
        applyDialogState({ speaker, text, color, visible: true });
      }
    };

    // Начальное состояние — диалог скрыт
    (function init() {
      const container = document.getElementById('dialog-container');
      if (container) container.style.display = 'none';
    })();

    // Для быстрого теста в браузере (можно раскомментировать):
    // setTimeout(() => {
    //   window.DialogUI.forceShow("Юки", "Привет! Это тестовый диалог.<br>С поллингом и авто-скрытием.", "#FF5252");
    // }, 800);
  </script>
</body>
</html>
