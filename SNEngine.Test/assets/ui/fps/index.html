<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>FPS Debug</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: transparent;
            font-family: 'Segoe UI', system-ui, sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }

        #fps {
            position: fixed;
            top: 10px;
            left: 10px;
            font-size: 13px;
            font-weight: 700;
            color: #ffffff;
            background: #1e1e1e;
            border: 2px solid #FF5252;
            border-radius: 8px;
            padding: 4px 10px;
            display: inline-flex;
            align-items: center;
            white-space: nowrap;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
            z-index: 10000;
            animation: fps-outline-blink 1.1s infinite ease-in-out;
        }

        @keyframes fps-outline-blink {
            0%, 100% {
                border-color: #FF5252;
                outline: 3px solid rgba(255, 82, 82, 0.0);
                outline-offset: 0px;
            }

            50% {
                border-color: #ff9999;
                outline: 3px solid rgba(255, 82, 82, 0.5);
                outline-offset: 2px;
            }
        }

        .fps-label {
            color: #eeeeee;
            opacity: 0.8;
            margin-right: 5px;
        }

        #fps-value {
            color: #FF5252;
            font-variant-numeric: tabular-nums;
            display: inline-block;
            min-width: 20px;
            text-align: left;
        }
    </style>
</head>
<body>

    <div id="fps"><span class="fps-label">FPS:</span><span id="fps-value">--</span></div>

    <script>
        const fpsValueElement = document.getElementById('fps-value');

        function updateFPS() {
            const fps = window.fps || 0;
            fpsValueElement.textContent = Math.round(fps);
        }

        setInterval(updateFPS, 100);

    </script>
</body>
</html>
