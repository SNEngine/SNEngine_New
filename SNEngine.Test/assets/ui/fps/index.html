<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>FPS Counter</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: transparent;
            font-family: Consolas, monospace;
            font-size: 18px;
            color: #ffffff;
            overflow: hidden;
        }

        #fps {
            position: fixed;
            top: 12px;
            left: 12px;
            padding: 8px 14px;
            background: rgba(0, 0, 0, 0.75);
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            user-select: none;
            pointer-events: none;
            z-index: 9999;
            font-weight: bold;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
        }

        .native {
            color: #00ffaa;
        }
    </style>
</head>
<body>
    <div id="fps">FPS: -- <span style="font-size:14px;color:#aaa;">(native)</span></div>

    <script>
        const fpsDisplay = document.getElementById('fps');

        // === ДИАГНОСТИКА ===
        console.log("[FPS] Script started");

        if (typeof sn !== "undefined") {
            console.log("[FPS] 'sn' object exists. Keys:", Object.keys(sn));
        } else {
            console.error("[FPS] 'sn' object is NOT defined!");
        }

        if (typeof sn !== "undefined" && typeof sn.Native !== "undefined") {
            console.log("[FPS] sn.Native exists. Methods:", Object.keys(sn.Native));
        } else {
            console.warn("[FPS] sn.Native is NOT available");
        }

        if (typeof SNEngineHost !== "undefined") {
            console.log("[FPS] SNEngineHost is available");
        }

        // Основная функция обновления
        function updateNativeFPS() {
            try {
                if (typeof sn === "undefined" || typeof sn.Native === "undefined" || typeof sn.Native.GetFPS !== "function") {
                    console.warn("[FPS] sn.Native.GetFPS is not ready yet");
                    fpsDisplay.textContent = "FPS: WAIT";
                    setTimeout(updateNativeFPS, 500);
                    return;
                }

                const fps = sn.Native.GetFPS();

                console.log("[FPS] sn.Native.GetFPS() returned:", fps);

                if (typeof fps === "number" && !isNaN(fps)) {
                    const rounded = Math.round(fps);
                    fpsDisplay.innerHTML = `FPS: <span class="native">${rounded}</span> <span style="font-size:14px;color:#aaa;">(native)</span>`;
                } else {
                    fpsDisplay.textContent = "FPS: ---";
                }
            } catch (e) {
                console.error("[FPS] Error calling sn.Native.GetFPS():", e);
                fpsDisplay.textContent = "FPS: ERR";
            }

            setTimeout(updateNativeFPS, 200);
        }

        // Запуск
        setTimeout(updateNativeFPS, 150);
    </script>
</body>
</html>
