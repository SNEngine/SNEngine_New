<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>FPS Counter</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: transparent;
      font-family: Consolas, monospace;
      font-size: 18px;
      color: #ffffff;
      overflow: hidden;
    }

    #fps {
      position: fixed;
      top: 12px;
      left: 12px;
      padding: 6px 12px;
      background: rgba(0, 0, 0, 0.6);
      border-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      user-select: none;
      pointer-events: none;
      z-index: 9999;
      font-weight: bold;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <div id="fps">FPS: --</div>

  <script>
    const fpsDisplay = document.getElementById('fps');

    let frameCount = 0;
    let lastTime = performance.now();
    let fps = 0;

    function updateFPS() {
      frameCount++;
      const now = performance.now();

      if (now - lastTime >= 1000) {
        fps = frameCount;
        fpsDisplay.textContent = `FPS: ${fps}`;
        frameCount = 0;
        lastTime = now;
      }

      requestAnimationFrame(updateFPS);
    }

    // Стартуем
    requestAnimationFrame(updateFPS);
  </script>
</body>
</html>
