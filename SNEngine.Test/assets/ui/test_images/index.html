<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Тест изображений</title>
    <style>
        body {
            margin: 0;
            padding: 40px;
            background: transparent;
            color: white;
            font-family: 'Segoe UI', sans-serif;
            text-align: center;
        }

        img {
            max-width: 80%;
            border: 3px solid #FF5252;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
            margin: 20px auto;
            display: block;
        }

        h1 {
            color: #FF5252;
        }
    </style>
</head>
<body>
    <img src="media/portrait.png" alt="Тестовое изображение">

</body>
</html>
