<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Novel Dialog</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      background: transparent;
      position: relative;
      overflow: hidden;
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 20px;
      color: #eeeeee;
    }

    #dialog-container {
      position: absolute;
      bottom: 5%;
      left: 50%;
      transform: translateX(-50%);
      width: 85%;
      max-width: 1100px;
      background: #1e1e1e;
      border: 3px solid #FF5252;
      border-radius: 24px; /* более скруглённый */
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.8);
      padding: 14px 24px 18px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      animation: dialog-outline-blink 1.1s infinite ease-in-out;
    }

    @keyframes dialog-outline-blink {
      0%, 100% {
        border-color: #FF5252;
        outline: 6px solid rgba(255, 82, 82, 0.0);
        outline-offset: 0px;
      }
      50% {
        border-color: #ff9999;
        outline: 6px solid rgba(255, 82, 82, 0.6);
        outline-offset: 5px;
      }
    }

    #speaker {
      font-weight: 600;
      font-size: 20px;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .speaker-triangle {
      color: #FF5252;
      font-size: 15px;
      line-height: 1;
      animation: blink 1.1s infinite ease-in-out; /* синхронизировано с рамкой */
      flex-shrink: 0;
    }

    #dialog-text {
      font-size: 19px;
      line-height: 1.4;
      min-height: 60px;
      color: #eeeeee;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.2; }
    }
  </style>
</head>
<body>
  <div id="dialog-container">
    <div id="speaker">
      <span class="speaker-triangle">▶</span>
      <span id="speaker-name">Имя персонажа</span>
    </div>
    <div id="dialog-text">
      Здесь будет отображаться текст диалога. Можно обновлять через JavaScript.
    </div>
  </div>

  <script>
    // Пример API для управления диалогом извне (через Ultralight)
    window.DialogUI = {
      setSpeaker(name) {
        const nameEl = document.getElementById('speaker-name');
        if (nameEl) nameEl.textContent = name || '';
      },
      setText(text) {
        document.getElementById('dialog-text').innerHTML = text || '';
      },
      clear() {
        const nameEl = document.getElementById('speaker-name');
        if (nameEl) nameEl.textContent = '';
        document.getElementById('dialog-text').innerHTML = '';
      }
    };

    // Для теста можно раскомментировать:
    // DialogUI.setSpeaker("Юки");
    // DialogUI.setText("Привет... Это тестовый диалог для визуальной новеллы.");
  </script>
</body>
</html>
