<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Novel Dialog</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            background: transparent;
            position: relative;
            overflow: hidden;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            font-size: 20px;
            color: #eeeeee;
        }

        /* Главное диалоговое окно */
        #dialog-container {
            position: absolute;
            bottom: 5%;
            left: 50%;
            transform: translateX(-50%);
            width: 85%;
            max-width: 1100px;
            background: #1e1e1e;
            border: 3px solid #FF5252;
            border-radius: 24px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.8);
            padding: 14px 24px 18px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            animation: dialog-outline-blink 1.1s infinite ease-in-out;
        }

        /* Пульсирующее свечение рамки окна */
        @keyframes dialog-outline-blink {
            0%, 100% {
                border-color: #FF5252;
                outline: 6px solid rgba(255, 82, 82, 0.0);
                outline-offset: 0px;
            }

            50% {
                border-color: #ff9999;
                outline: 6px solid rgba(255, 82, 82, 0.6);
                outline-offset: 5px;
            }
        }

        /* Блок имени говорящего */
        #speaker {
            font-weight: 600;
            font-size: 20px;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Мигающий маркер рядом с именем */
        .speaker-triangle {
            color: #FF5252;
            font-size: 15px;
            line-height: 1;
            animation: blink 1.1s infinite ease-in-out;
            flex-shrink: 0;
        }

        /* Контейнер для отображения текста диалога */
        #dialog-text {
            font-size: 19px;
            line-height: 1.45;
            min-height: 60px;
            color: #eeeeee;
            padding-bottom: 8px; /* space for the continue indicator */
        }

        /* Индикатор "клик для продолжения" — показывается когда typing завершён */
        #continue-indicator {
            position: absolute;
            right: 22px;
            bottom: 10px;
            font-size: 13px;
            line-height: 1;
            color: #FF5252;
            opacity: 0.85;
            pointer-events: none; /* не перехватывает клики */
            animation: blink 0.85s infinite ease-in-out;
            display: none;
            z-index: 10;
        }

        /* Базовая анимация мигания элементов */
        @keyframes blink {
            0%, 100% {
                opacity: 1;
            }

            50% {
                opacity: 0.2;
            }
        }

        /* ==========================================================================
           АНИМАЦИИ ПОЯВЛЕНИЯ СИМВОЛОВ (Применяются автоматически к новым тегам span)
           ========================================================================== */

        .char {
            display: inline-block;
        }

        /* 1. Эффект: Pop (Плавное выталкивание вверх) */
        #dialog-text.anim-pop .char {
            opacity: 0;
            transform: translateY(8px);
            animation: charPop 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes charPop {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 2. Эффект: Fade (Простое плавное появление) */
        #dialog-text.anim-fade .char {
            opacity: 0;
            animation: charFade 0.2s ease-out forwards;
        }

        @keyframes charFade {
            to {
                opacity: 1;
            }
        }

        /* 3. Эффект: Scale (Мягкое разрастание из центра) */
        #dialog-text.anim-scale .char {
            opacity: 0;
            transform: scale(0.6);
            animation: charScale 0.2s ease-out forwards;
        }

        @keyframes charScale {
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* 4. Эффект: Pop-Fade (Комбинированный: мягкое выталкивание + плавное появление) */
        #dialog-text.anim-pop-fade .char {
            opacity: 0;
            transform: translateY(6px);
            animation: charPopFade 0.25s ease-out forwards;
        }

        @keyframes charPopFade {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 5. Вариант: None (Без анимации — символы видны сразу) */
        #dialog-text.anim-none .char {
            opacity: 1;
            transform: none;
            animation: none;
        }
    </style>
</head>
<body>
    <div id="dialog-container">
        <div id="speaker">
            <span class="speaker-triangle">▶</span>
            <span id="speaker-name">Имя персонажа</span>
        </div>
        <div id="dialog-text" class="anim-pop"></div>
        <div id="continue-indicator">▼</div>
    </div>

    <script>
        // Глобальные переменные состояния UI
        let rafId = null;              // ID запущенного requestAnimationFrame
        let currentText = '';         // Текущий выведенный текст (для отслеживания инкремента)
        let lastSpeaker = '';         // Имя предыдущего спикера (для отслеживания смены персонажа)

        // Доступные типы анимаций: 'pop', 'fade', 'scale', 'pop-fade', 'none'
        let currentAnimationType = 'pop';

        /**
         * Создает изолированный DOM-узел для одного символа строки.
         * Обертка в тег span необходима для применения индивидуальных CSS-анимаций.
         */
        function createCharNode(char) {
            const span = document.createElement('span');
            span.className = 'char';
            // Замена стандартного пробела на неразрывный для корректного инлайнового отображения
            span.innerHTML = char === ' ' ? '&nbsp;' : char;
            return span;
        }

        /**
         * Переключает CSS-классы анимации на контейнере текста.
         */
        function setAnimationClass(type) {
            const textEl = document.getElementById('dialog-text');
            if (!textEl) return;

            const validTypes = ['pop', 'fade', 'scale', 'pop-fade', 'none'];
            const targetType = validTypes.includes(type) ? type : 'none';

            // Переключаем классы только если тип анимации действительно изменился
            if (currentAnimationType !== targetType) {
                textEl.classList.remove('anim-pop', 'anim-fade', 'anim-scale', 'anim-pop-fade', 'anim-none');
                textEl.classList.add(`anim-${targetType}`);
                currentAnimationType = targetType;
            }
        }

        /**
         * Основной метод синхронизации состояния. Принимает Snapshot из C# ядра.
         */
        function applyDialogState(state) {
            const container = document.getElementById('dialog-container');
            const nameEl = document.getElementById('speaker-name');
            const textEl = document.getElementById('dialog-text');

            if (!container || !nameEl || !textEl) return;

            // Проверка валидности данных и флага видимости
            const hasContent = state && state.visible !== false && (state.speaker || state.text);

            if (!hasContent) {
                container.style.display = 'none';
                currentText = '';
                lastSpeaker = '';
                const indicator = document.getElementById('continue-indicator');
                if (indicator) indicator.style.display = 'none';
                return;
            }

            container.style.display = 'flex';

            // Автоматическая смена анимации, если движок передал новое значение в snapshot
            if (state.animationType) {
                setAnimationClass(state.animationType);
            }

            // Показываем индикатор "продолжить" только когда текст полностью напечатан (complete === true)
            const indicator = document.getElementById('continue-indicator');
            if (indicator) {
                indicator.style.display = (state.complete === true) ? 'block' : 'none';
            }

            // Логика смены спикера: при новом имени очищаем текстовое поле
            if (state.speaker !== lastSpeaker) {
                nameEl.textContent = state.speaker || '';
                nameEl.style.color = state.color || '#ffffff';
                lastSpeaker = state.speaker || '';
                textEl.innerHTML = '';
                currentText = '';
            }

            const newText = state.text || '';

            // Оптимальный рендеринг: посимвольное добавление, если строка просто растет
            if (newText.length > currentText.length && newText.startsWith(currentText)) {
                const newPart = newText.slice(currentText.length);
                for (let char of newPart) {
                    textEl.appendChild(createCharNode(char));
                }
            }
            // Полная перерисовка, если строка полностью изменилась или сбросилась
            else if (newText !== currentText) {
                textEl.innerHTML = '';
                for (let char of newText) {
                    textEl.appendChild(createCharNode(char));
                }
            }

            currentText = newText;
        }

        /**
         * Кадровое чтение данных из глобального объекта моста SNEngine
         */
        function updateFromRuntime() {
            try {
                const runtime = (window.SNEngine && window.SNEngine.runtime) || {};
                const dialogState = runtime.dialog;
                applyDialogState(dialogState);
            } catch (e) {
                console.warn('[DialogUI] update error', e);
            }

            rafId = requestAnimationFrame(updateFromRuntime);
        }

        /**
         * Запуск цикла непрерывного обновления интерфейса
         */
        function startListening() {
            if (rafId) cancelAnimationFrame(rafId);
            rafId = requestAnimationFrame(updateFromRuntime);
        }

        /**
         * Публичное API окна диалогов для внешнего управления (из консоли или C#)
         */
        window.DialogUI = {
            // Установка режима анимации букв ('pop', 'fade', 'scale', 'pop-fade', 'none')
            setAnimation(type) {
                setAnimationClass(type);
            },
            // Принудительная установка имени
            setSpeaker(name) {
                const nameEl = document.getElementById('speaker-name');
                if (nameEl) nameEl.textContent = name || '';
            },
            // Мгновенное заполнение текста (в обход стриминга кадров)
            setText(text) {
                const textEl = document.getElementById('dialog-text');
                if (textEl) {
                    textEl.innerHTML = '';
                    currentText = text || '';
                    for (let char of currentText) {
                        textEl.appendChild(createCharNode(char));
                    }
                }
            },
            // Полная очистка и скрытие данных
            clear() {
                const textEl = document.getElementById('dialog-text');
                const nameEl = document.getElementById('speaker-name');
                if (textEl) textEl.innerHTML = '';
                if (nameEl) nameEl.textContent = '';
                currentText = '';
                lastSpeaker = '';
                const indicator = document.getElementById('continue-indicator');
                if (indicator) indicator.style.display = 'none';
            },
            // Принудительное отображение статического состояния диалога
            forceShow(speaker, text, color, animType = 'pop') {
                currentText = '';
                lastSpeaker = '';
                setAnimationClass(animType);
                applyDialogState({ speaker, text, color, visible: true, animationType: animType });
            }
        };

        /**
         * Привязывает клик по диалоговому окну к вызову Advance в C#.
         * Это главный механизм "ожидания клика" вместо автопродолжения по окончанию текста.
         */
        function setupClickAdvance() {
            const container = document.getElementById('dialog-container');
            if (!container) return;

            container.addEventListener('click', function (ev) {
                // Защита от кликов по невидимому контейнеру
                if (container.style.display === 'none') return;

                try {
                    if (window.SNEngineHost && typeof window.SNEngineHost.call === 'function') {
                        // Fire-and-forget: не ждём Promise в обработчике клика
                        window.SNEngineHost.call('DialogueAPI.Advance', []);
                    } else {
                        // Fallback для отладки (если хост не подключён)
                        console.log('[DialogUI] Advance requested (no SNEngineHost)');
                    }
                } catch (e) {
                    console.warn('[DialogUI] Advance call failed', e);
                }
            });

            // Делаем курсор pointer когда контейнер видим (улучшает UX)
            container.style.cursor = 'pointer';
        }

        // Точка входа: инициализация начального состояния
        (function init() {
            const container = document.getElementById('dialog-container');
            if (container) container.style.display = 'none';

            // Подключаем обработчик кликов для advance (новая модель ожидания)
            setupClickAdvance();
        })();

        // По умолчанию активируем режим анимации 'pop'
        window.DialogUI.setAnimation('pop-fade');
        // Запуск прослушивания изменений кадров движка
        startListening();
    </script>
</body>
</html>
