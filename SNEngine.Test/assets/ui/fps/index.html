<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>FPS Debug</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: transparent;
            font-family: 'Segoe UI', system-ui, sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }

        #fps {
            position: fixed;
            top: 10px;
            left: 10px;
            font-size: 13px;
            font-weight: 700;
            color: #ffffff;
            background: #1e1e1e;
            border: 2px solid #FF5252;
            border-radius: 8px;
            padding: 4px 10px;
            display: inline-flex;
            align-items: center;
            white-space: nowrap;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
            z-index: 10000;
            /* visibility and pulsation controlled by JS via runtime.fpsVisible (set by FPSSystem) */
        }

        @keyframes fps-outline-blink {
            0%, 100% {
                border-color: #FF5252;
                outline: 3px solid rgba(255, 82, 82, 0.0);
                outline-offset: 0px;
            }

            50% {
                border-color: #ff9999;
                outline: 3px solid rgba(255, 82, 82, 0.5);
                outline-offset: 2px;
            }
        }

        .fps-label {
            color: #eeeeee;
            opacity: 0.8;
            margin-right: 5px;
        }

        #fps-value {
            color: #FF5252;
            font-variant-numeric: tabular-nums;
            display: inline-block;
            min-width: 20px;
            text-align: left;
        }
    </style>
</head>
<body>

    <div id="fps"><span class="fps-label">FPS:</span><span id="fps-value">--</span></div>

    <script>
        const fpsEl = document.getElementById('fps');
        const fpsValueElement = document.getElementById('fps-value');

        /**
         * Simple update: always refresh the FPS value.
         * Visibility is controlled by the C# FPSSystem via runtime.fpsVisible (true/false).
         * The JS just reads it each tick and sets opacity (no complex classes/raf/state).
         * Defaults to visible if the flag is not (yet) present — matches browser behavior and FPSSystem default.
         */
        function updateFPS() {
            const runtime = (window.SNEngine && window.SNEngine.runtime) || {};
            // fpsVisible may be undefined on first frames — treat as "show"
            const show = (runtime.fpsVisible !== false);
            if (fpsEl) {
                fpsEl.style.opacity = show ? '1' : '0';
                fpsEl.style.pointerEvents = show ? 'auto' : 'none';
                fpsEl.style.animation = show ? 'fps-outline-blink 1.1s infinite ease-in-out' : 'none';
            }
            if (fpsValueElement) {
                const fps = runtime.fps || 0;
                fpsValueElement.textContent = Math.round(fps);
            }
        }

        // Simple interval like the original — reliable and easy to debug.
        setInterval(updateFPS, 100);

        // Run once immediately so it shows right after the HTML is injected (no waiting for first tick).
        updateFPS();

        // No complex public API or raf needed for a debug counter.
        // The C# FPSSystem controls visibility by setting runtime.fpsVisible (true/false) each frame.
        // Keys (F1/F) are handled in C# FPSSystem.OnKeyDown and affect the pushed data.
    </script>
</body>
</html>
